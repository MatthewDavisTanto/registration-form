```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .form-container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .option {
            width: auto;
        }

        textarea {
            height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>Registration Form</h1>

        <form>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone">

            <label>Gender:</label>
            <input class="option" type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input class="option" type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <label>Hobbies:</label>
            <input class="option" type="checkbox" id="gaming" name="hobbies" value="gaming">
            <label for="gaming">Gaming</label>

            <input class="option" type="checkbox" id="music" name="hobbies" value="music">
            <label for="music">Music</label>

            <input class="option" type="checkbox" id="sports" name="hobbies" value="sports">
            <label for="sports">Sports</label>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">

            <label for="program">Program of Study:</label>
            <select id="program" name="program">
                <option value="">-- Select Program --</option>
                <option value="information-systems">Information Systems</option>
                <option value="computer-science">Computer Science</option>
                <option value="business">Business</option>
                <option value="accounting">Accounting</option>
            </select>

            <label for="address">Full Address:</label>
            <textarea id="address" name="address"></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
```
